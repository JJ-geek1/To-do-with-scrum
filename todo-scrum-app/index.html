<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Executive Scrum Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Top Workspace Header -->
        <header class="app-header">
            <div class="workspace-brand">
                <div class="brand-logo">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <div>
                    <h1>TaskFlow Pro</h1>
                    <p class="workspace-subtitle">Scrum Sprint Workspace & Alarms</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="notification-permission-btn" class="icon-btn" title="Enable Desktop Notifications">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Progress Overview Card -->
        <section class="progress-card">
            <div class="progress-info">
                <span>Sprint Progress</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-track">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </section>

        <!-- Task Input Form with Calendar / Due Date & Alarm -->
        <form id="task-form" class="task-form-card">
            <div class="input-main-row">
                <input type="text" id="task-input" placeholder="Add a new sprint task..." required autocomplete="off">
                <select id="category-select">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="input-secondary-row">
                <div class="date-picker-wrapper">
                    <i class="fa-regular fa-calendar"></i>
                    <input type="datetime-local" id="task-due-date" required>
                </div>
                <button type="submit" id="add-btn">
                    <i class="fa-solid fa-plus"></i> Schedule Task
                </button>
            </div>
        </form>

        <!-- Search and Filter Toolbar -->
        <div class="toolbar">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Filter tasks...">
            </div>
        </div>

        <!-- Task List Header Counter -->
        <div class="list-meta">
            <span id="task-counter">0 tasks remaining</span>
            <button id="clear-completed" class="text-action-btn">Clear completed</button>
        </div>

        <!-- Dynamic Task List -->
        <ul id="task-list"></ul>
    </div>

    <!-- Alarm Sound Audio Element -->
    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
